map $host $redirect_to_www {
    default              0;
    roylarsen.xyz        1;
    blog.roylarsen.xyz   1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind the Cloudflare tunnel: redirects must keep the public host and scheme
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/xml application/atom+xml image/svg+xml;

    if ($redirect_to_www) {
        return 301 https://www.roylarsen.xyz$request_uri;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=300";

    location /theme/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Old Ghost-style links in posts use /slug/ but Pelican writes slug.html
    location ~ ^/(.+)/$ {
        try_files $uri/index.html /$1.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

# Scraped in-cluster by the nginx-prometheus-exporter sidecar; not exposed via the tunnel
server {
    listen 8081;
    access_log off;

    location = /stub_status {
        stub_status;
    }
}
